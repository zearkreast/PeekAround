[package]
name = "pa-web"
description = "PeekAround in the browser: the Slint UI compiled to WebAssembly, served by the Docker server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.92"

[lib]
crate-type = ["cdylib", "rlib"]

# everything is for the browser: on the other targets this crate is empty
[target.'cfg(target_arch = "wasm32")'.dependencies]
pa-ui = { path = "../pa-ui", default-features = false, features = ["http", "web"] }
pa-client = { path = "../pa-client" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "History", "Location", "Navigator", "Clipboard", "console"] }
console_error_panic_hook = "0.1"
log = "0.4"
