<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0b10">
  <title>PeekAround</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b10; color: #e7e7ee;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; touch-action: none; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px;
      align-items: center; justify-content: center; background: #0b0b10; text-align: center; padding: 24px; }
    #boot img { width: 88px; height: 88px; }
    #boot .bar { width: 180px; height: 3px; border-radius: 3px; background: #23232e; overflow: hidden; }
    #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #8b5cf6;
      animation: slide 1.1s ease-in-out infinite; }
    #boot.failed .bar { display: none; }
    #boot p { margin: 0; max-width: 520px; color: #a3a3b5; }
    @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="boot">
    <img src="logo.svg" alt="">
    <div class="bar"><i></i></div>
    <p id="boot-text"></p>
  </div>
  <script type="module">
    import init from './peekaround.js';

    const boot = document.getElementById('boot');
    const text = document.getElementById('boot-text');
    const tr = (navigator.language || 'tr').toLowerCase().startsWith('tr');
    text.textContent = tr ? 'PeekAround yükleniyor…' : 'Loading PeekAround…';

    function failed(detail) {
      boot.classList.add('failed');
      text.textContent = (tr
        ? 'PeekAround açılamadı. Tarayıcının WebAssembly ve WebGL desteklediğinden emin ol. '
        : 'PeekAround could not start. Make sure this browser supports WebAssembly and WebGL. ') + detail;
    }

    if (typeof WebAssembly !== 'object') {
      failed('');
    } else {
      init().then(() => boot.remove(), (e) => {
        // the UI's event loop takes over by throwing this on purpose
        if (String(e && e.message || e).includes('Using exceptions for control flow')) boot.remove();
        else failed(String(e));
      });
    }
  </script>
</body>
</html>
