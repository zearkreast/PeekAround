[package]
name = "pa-client"
description = "PeekAround typed API client (HTTP + live events WebSocket) over the pa-core API types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.92"

[dependencies]
pa-core = { path = "../pa-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# reqwest also builds for wasm32 (fetch based) — the HTTP half of this crate is shared
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
log = "0.4"
percent-encoding = "2"

# native transport for the live events socket (wasm32: web-sys WebSocket, see src/events.rs)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
# streamed uploads of local files
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1", "json", "query"] }
