[package]
name = "pa-media"
description = "PeekAround media engine: image decode/resize/encode, thumbhash, ffmpeg CLI wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["heif", "svg"]
# HEIC/HEIF/AVIF through libheif (system library, found with pkg-config, >= 1.17)
heif = ["dep:libheif-rs"]
# build libheif from the sources bundled in libheif-sys (cmake; codecs such as libde265 still come
# from the build machine / sysroot) — for Windows (vcpkg), Android and Docker packaging
heif-embedded = ["heif", "libheif-rs/embedded-libheif"]
# SVG rasterization (resvg, pure Rust)
svg = ["dep:resvg"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "bmp", "tiff", "ico", "jpeg"] }
mozjpeg = "0.10"
webp = { version = "0.3", default-features = false }
fast_image_resize = { version = "6", features = ["image"] }
libheif-rs = { version = "3", default-features = false, features = ["v1_17"], optional = true }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"], optional = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
imagesize = "0.13"
libm = "0.2"
moxcms = "0.8"
rand = "0.8"
tokio = { version = "1", features = ["process", "time", "sync", "rt", "macros", "io-util", "fs"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs"] }
