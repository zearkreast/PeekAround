[package]
name = "pa-phone"
description = "PeekAround phone side of the phone ↔ PC link (docs/link-protocol.md): control WebSocket, reply PUTs, pulls, folder watching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.92"
publish = false

[dependencies]
pa-core = { path = "../pa-core" }
pa-media = { path = "../pa-media", default-features = false }
pa-meta = { path = "../pa-meta" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
notify = "8"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"

[dev-dependencies]
pa-server = { path = "../pa-server", default-features = false }
pa-client = { path = "../pa-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
