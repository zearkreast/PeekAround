[package]
name = "pa-ui"
description = "PeekAround Slint UI (all screens + view models), backend-agnostic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.92"

[features]
default = ["http", "desktop", "gpu"]
# the Backend implementation over the HTTP/WS API (pa-client)
http = ["dep:pa-client"]
# windowing: winit on Windows / Linux / macOS, android-activity (NativeActivity) on Android
desktop = ["slint/backend-winit", "slint/unstable-winit-030", "audio", "clipboard"]
# audio output of the video / audio player (cpal; without it audio plays to a null sink)
audio = ["dep:cpal"]
# copy path → system clipboard
clipboard = ["dep:arboard"]
android = ["slint/backend-android-activity-06"]
# the browser build (the Docker web UI): winit on a canvas
web = ["slint/backend-winit", "slint/unstable-winit-030"]
# photo editor adjustments on the GPU (wgpu, headless); without it a CPU path renders them
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
# femtovg (OpenGL) renderer on winit; no Qt, no skia (prebuilt binaries / huge source build)
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg", "unstable-fontique-011"] }
pa-core = { path = "../pa-core", default-features = false }
pa-client = { path = "../pa-client", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `Instant` / `SystemTime` that also work in the browser (std's own on the other targets)
web-time = "1"
# WOFF 1.0 tables (Fonts page previews)
flate2 = "1"
bytes = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
thumbhash = "0.1"
# LAN address QR code (Settings → Network)
qrcode = { version = "0.14", default-features = false }
lru = "0.12"
log = "0.4"
cpal = { version = "0.16", optional = true }
arboard = { version = "3", default-features = false, optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan", "metal"], optional = true }
pollster = { version = "0.4", optional = true }
# photo editor text layers and brush strokes: the layout and rasterizer Slint itself uses, so
# fonts registered with Slint (bundled, uploaded) render the same in the saved file
parley = { version = "=0.11.1", default-features = false, features = ["std", "system"] }
swash = { version = "=0.2.10", default-features = false, features = ["std", "render"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "fs"] }
dirs = "6"

# the browser build: no tokio runtime (channels only), the page's own APIs instead
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "CanvasGradient", "CanvasRenderingContext2d", "DataTransfer", "Document", "DragEvent", "Element",
    "Event", "EventTarget", "File", "FileList", "HtmlAnchorElement", "HtmlAudioElement", "HtmlCanvasElement", "HtmlElement",
    "HtmlInputElement", "HtmlMediaElement", "HtmlVideoElement", "ImageBitmap", "ImageData", "MediaError",
    "MediaQueryList", "Navigator", "Node", "Response", "Storage", "TimeRanges", "Url", "Window",
] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
regex-lite = "0.1"
