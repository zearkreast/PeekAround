[package]
name = "pa-core"
description = "PeekAround pure logic + API types (port of packages/shared)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["gzip"]
# decompress the gzip'ed GeoNames asset (`geo::decode_geo_asset`)
gzip = ["dep:flate2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
unicode-normalization = "0.1"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
icu_collator = "2"
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
