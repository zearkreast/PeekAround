[package]
name = "pa-jobs"
description = "PeekAround job engine: queue + lanes, video edit / slideshow export (ffmpeg), live transcode streams"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pa-core = { path = "../pa-core" }
pa-media = { path = "../pa-media", default-features = false, features = ["svg"] }
pa-meta = { path = "../pa-meta" }
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false }
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs", "io-util", "process"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
