name: Rust Android package

# 2.0 Android app (crates/pa-android): the Rust library for arm64-v8a with the NDK of the runner,
# then the small Gradle project around it (NativeActivity + the sharing service), uploaded as a
# run artifact. Runs only on demand: push a `build-android-<anything>` tag (workflow_dispatch needs
# the file on the default branch, which stays on 1.x). Releases are published by hand.
# Signing: with the ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# secrets (the 1.x key) a release APK that installs over 1.3.x; without them a debug APK.
on:
  workflow_dispatch:
  push:
    tags: ['build-android-*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET: aarch64-linux-android
      API: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
      # restore + save (also after a failed build: the next attempt starts warm)
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-android-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: rust-android-
      - name: Build the Rust library
        run: |
          tc="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android$API-clang"
          export CXX_aarch64_linux_android="$tc/aarch64-linux-android$API-clang++"
          export AR_aarch64_linux_android="$tc/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android$API-clang"
          cargo build -p pa-android --lib --release --target "$TARGET"
          so="target/$TARGET/release/libpeekaround_android.so"
          ls -la "$so"
          "$tc/llvm-readelf" -d "$so" | grep NEEDED
          libs=crates/pa-android/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$libs"
          cp "$so" "$libs/"
          # C++ dependencies (skia) link against the shared libc++ of the NDK when they need it
          if "$tc/llvm-readelf" -d "$so" | grep -q 'libc++_shared'; then
            cp "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$libs/"
          fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-android-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
      - name: Build the APK
        working-directory: crates/pa-android/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "::notice::No signing secrets set - building a debug APK"
            ./gradlew --no-daemon assembleDebug
          fi
      - name: Collect APK
        run: |
          mkdir -p dist
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          find crates/pa-android/android/app/build/outputs/apk -name '*.apk' | while read -r f; do
            kind=$(basename "$(dirname "$f")")
            cp "$f" "dist/PeekAround-${version}-android-arm64-${kind}.apk"
          done
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peekaround-android
          path: dist/*.apk
          if-no-files-found: error
